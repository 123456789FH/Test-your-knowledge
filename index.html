{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;border-radius:12px;padding:7px 17px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;text-decoration:none}.btn:hover,.card:hover{filter:brightness(.98)}.btn.primary{background:var(--nav);border-color:var(--nav);color:var(--surface)}.hero .btn{background:#263b55;color:white;border-color:#263b55;padding:8px 19px}.btn.soft{background:var(--soft)}.btn.flagged{background:#fff0bd;color:#714c0e;border-color:#d9af56}.section-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:27px 0 14px}.section-head h2{font-size:26px;letter-spacing:-.7px}.mode-switch{display:flex;align-items:center;padding:3px;border:1px solid var(--line);border-radius:13px;background:var(--soft);gap:2px}.mode-switch button{color:var(--muted);border-radius:9px;display:inline-flex;align-items:center;gap:6px;padding:5px 13px;font-size:13px}.mode-switch .chosen{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px #22384b1c}.mode-note{font-size:13px;color:var(--muted);margin-top:3px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{display:flex;flex-direction:column;align-items:stretch;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:19px;overflow:hidden;padding:0;transition:transform .16s,box-shadow .16s}.card:hover{transform:translateY(-3px);box-shadow:0 7px 20px #2038540c}.cardpic{height:94px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #30435313}.mint{background:var(--mint)}.lilac{background:var(--lilac)}.peach{background:var(--peach)}.cardpic::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#233b542e .8px,transparent .8px);background-size:11px 11px;mask-image:linear-gradient(90deg,#000,transparent 28%,transparent 70%,#000)}.cardpic svg{width:100%;height:84px}.cardbody{display:block;padding const arabic = value => String(value).replace(/[0-9]/g, digit => '٠١٢٣٤٥٦٧٨٩'[digit]);
const escapeHTML = value => String(value).replace(/[&<>"']/g, letter => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[letter]));
function math(expression) {
  const tokens=expression.trim().split(/\s+/);
  return '<span class="math" dir="rtl">'+tokens.map(t=>'<bdi dir="ltr">'+escapeHTML(arabic(t))+'</bdi>').join(' ')+'</span>';
}
function rich(value) {
  return String(value).split(/(\{[^{}]+\})/g).map(part=>part.startsWith('{')?math(part.slice(1,-1)):escapeHTML(arabic(part))).join('');
}

 page='report';navState();const sc=score(s),qs=bank[s.form];
 const stats=skills.map((label,k)=>{const group=qs.map((q,i)=>q.skill===k?i:-1).filter(i=>i>=0);if(!group.length)return '';
 const ok=group.filter(i=>s.answers[i]===qs[i].correct).length;
 return '<div class="skillrow"><span>'+label+'</span><strong>'+arabic(ok)+' من '+arabic(group.length)+'</strong></div>';}).join('');
 const reviews=qs.map((q,i)=>{
 const a=s.answers[i],ok=a===q.correct;if(reviewFilter==='missed'&&ok)return '';
 return '<details class="panel review"><summary><strong>السؤال '+arabic(i+1)+'</strong><span class="status '+(ok?'ok':a===null?'':'no')+'">'+(ok?'صحيحة':a===null?'متروكة':'غير صحيحة')+'</span></summary><div class="review-body"><h3>'+rich(q.prompt)+'</h3>'+visual(q.visual)+'<p><strong>إجابتك</strong> · '+(a===null?'لم تُحدّد إجابة':choiceMarkup(q.choices[a]))+'</p>'+(!ok?'<p><strong>الإجابة الصحيحة</strong> · '+choiceMarkup(q.choices[q.correct])+'</p>':'')+'<div class="feedback">'+rich(q.explanation)+'</div></div></details>';
 }).join('');
 app.innerHTML='<button class="back" data-act="history">'+icon('right',16)+'نتائجي</button><h1 id="pageTitle" class="page-title">نتيجة المحاولة</h1><p class="subtitle">'+title(s.form)+' · '+modeNames[s.mode]+'</p><section class="panel report"><div class="score-ring" style="--pct:'+sc.pct+'%"><b>'+arabic(sc.pct)+'٪</b></div><div><h2>'+arabic(sc.correct)+' إجابة صحيحة من '+arabic(sc.n)+'</h2><p class="shade">غير صحيحة '+arabic(sc.wrong)+' &nbsp;·&nbsp; متروكة '+arabic(sc.blank)+'</p><div class="row">'+(sc.correct/sc.n>=.8?button('cert','شهادة الإنجاز','primary','award'):'')+button('retry','إعادة المحاولة','','reset')+'</div></div></section><section><h2 style="margin-top:20px">أداؤك حسب المهارة</h2><div class="skillrows">'+stats+'</div></section><section><div class="section-head"><h2>مراجعة الإجابات</h2><div class="mode-switch" role="group" aria-label="تصفية المراجعة">'+[['all','الكل'],['missed','ما أراجعه']].map(([v,l])=>'<button data-act="filter" data-filter="'+v+'" class="'+(v===reviewFilter?'chosen':'')+'" aria-pressed="'+(v===reviewFilter)+'">'+l+'</button>').join('')+'</div></div><div class="review-list">'+(reviews||'<p class="panel">أجبت عن جميع الأسئلة إجابة صحيحة.</p>')+'</div></section>';
}
function renderCert(){
 const s=reportSession();if(!s||score(s).correct/score(s).n<.8)return;
 page='cert';navState();
 app.innerHTML='<div class="row spread no-print">'+button('backReport','العودة إلى النتيجة','','right')+button('print','طباعة الشهادة','primary','print')+'</div><section class="cert"><img src="'+document.querySelector('.brand img').src+'" alt="شعار ملتقى التعليم التفاعلي"><h1 id="pageTitle">شهادة إنجاز</h1><p>تُمنح هذه الشهادة إلى</p><h2><input id="certInput" maxlength="65" aria-label="الاسم في الشهادة" placeholder="اكتب الاسم هنا" value="'+escapeHTML(s.certName||'')+'"><span id="certName" class="cert-name">'+escapeHTML(s.certName||'')+'</span></h2><p>لإتقان مهارات «'+forms[s.form].title+'» في تطبيق «اختبر معلوماتك»</p><p>بنسبة <strong>'+arabic(score(s).pct)+'٪</strong> في رياضيات الصف الثالث الابتدائي</p><p>'+dateOf(s.finished)+'</p><footer>أ/ فاطمة هزازي<br>ملتقى معلمي ومعلمات الرياضيات · ملتقى التعليم التفاعلي</footer></section>';
 moveTop();
}
document.addEventListener('input',e=>{
 if(e.target.id==='certInput'){$('certName').textContent=e.target.value;const s=reportSession();if(s){s.certName=e.target.value;writeLocal('history',historyItems);}}
});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const act=el.dataset.act;
 if(act==='close'){closeDialog();return;}
 if(act==='confirm'){const run=pendingAction;closeDialog();run?.();return;}
 if(act==='theme'){document.documentElement.classList.toggle('dark');writeLocal('dark',document.documentElement.classList.contains('dark'));themeRender();return;}
 if(act==='help'){dialog('طريقة الاستخدام','<ol><li>اختر «اختبار» للتصحيح بعد التسليم، أو «تدريب» للتحقّق والشرح أثناء الحلّ.</li><li>افتح أحد النماذج. لكلّ سؤال أربعة خيارات وإجابة صحيحة واحدة.</li><li>يمكنك استبعاد خيارات، وتعليم سؤال للمراجعة، والتنقّل عبر خريطة الأسئلة.</li><li>سلّم محاولتك لعرض النتيجة. تحصل على شهادة إنجاز عند تحقيق ٨٠٪ فأكثر.</li></ol>');return;}
 if(act==='home'){renderHome();moveTop();return;}
 if(act==='history'){renderHistory();moveTop();return;}
 if(act==='mode'){selectedMode=el.dataset.mode;writeLocal('mode',selectedMode);renderHome();app.querySelector('[data-mode="'+selectedMode+'"]').focus({preventScroll:true});say(modeHint());return;}
 if(act==='pick'){const h=$('models');h.focus({preventScroll:true});h.scrollIntoView({block:'start'});return;}
 if(act==='start'){start(Number(el.dataset.form));return;}
 if(act==='resume'){strikeMode=false;renderQuiz();moveTop('questionTitle');return;}
 if(act==='submit'){confirmSubmit();return;}
 if(act==='report'){showReport(el.dataset.id);return;}
 if(act==='filter'){reviewFilter=el.dataset.filter;renderReport();app.querySelector('[data-filter="'+reviewFilter+'"]').focus({preventScroll:true});return;}
 if(act==='cert'){renderCert();return;}
 if(act==='backReport'){renderReport();moveTop();return;}
 if(act==='retry'){const s=reportSession();if(s){selectedMode=s.mode;start(s.form);}return;}
 if(act==='print'){
  const field=$('certInput');if(!field.value.trim()){field.focus();field.setCustomValidity('اكتب الاسم ليظهر في الشهادة.');field.reportValidity();field.setCustomValidity('');return;}
  window.print();return;
 }
 if(['answer','strike','flag','verify','jump','next','prev'].includes(act))quizUpdate(act,el);
});
modal.addEventListener('close',()=>{pendingAction=null;});
$('navHome').innerHTML=icon('home',17)+'الرئيسية';$('navHistory').innerHTML=icon('chart',17)+'نتائجي';
$('help').innerHTML=icon('help',19);$('closeBtn').innerHTML=icon('x',16);
const storedMode=readLocal('mode','exam');selectedMode=Object.hasOwn(modeNames,storedMode)?storedMode:'exam';
const restored=readLocal('active',null);active=validSession(restored)?restored:null;historyItems=getHistory();
if(active&&historyItems.some(h=>h.id===active.id)){active=null;saveActive();}
document.documentElement.classList.toggle('dark',readLocal('dark',false)===true);themeRender();renderHome();

</script>
</body>
</html>
